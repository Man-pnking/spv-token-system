<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <!-- Background -->
    <rect id="bg" width="32" height="32" fill="#111111"/>

    <!-- Gradients for the iridescent metallic look -->
    <linearGradient id="wingTopLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#555555" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#111111" stop-opacity="0.9"/>
      <stop offset="85%" stop-color="#00ffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff8c00" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="wingBottomLeft" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111111" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#333333" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#00ffff" stop-opacity="0.5"/>
      <stop offset="90%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff8c00" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="wingTopRight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111111" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#444444" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#ff8c00" stop-opacity="0.7"/>
      <stop offset="90%" stop-color="#00ffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="wingBottomRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111111" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#333333" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#00ffff" stop-opacity="0.6"/>
      <stop offset="85%" stop-color="#ff8c00" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>

    <radialGradient id="bodyGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#333333" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>

    <!-- Holographic Sheen Overlays -->
    <linearGradient id="holoSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00ffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff8c00" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Main Butterfly Group (Positioned at X = -8.00, Y = 9.84, corresponding to pixel 8.00, 8.16) -->
  <!-- Scaled to 0.9 to span ~16 units -->
  <g transform="translate(8.00, 8.16) scale(0.9)">
    <!-- Gentle floating up and down (centered on the current position) -->
    <animateTransform attributeName="transform" type="translate" values="8.00,8.16; 8.00,7.66; 8.00,8.16" dur="4s" repeatCount="indefinite" additive="sum"/>

    <!-- Left Wing Group -->
    <g>
      <!-- Flapping animation for Left Wing -->
      <animateTransform attributeName="transform" type="skewY" values="0; 15; 0; -10; 0" dur="0.6s" repeatCount="indefinite" additive="sum"/>
      <animateTransform attributeName="transform" type="scale" values="1,1; 0.8,1; 1,1; 1.1,1; 1,1" dur="0.6s" repeatCount="indefinite" additive="sum"/>
      
      <!-- Left Forewing (Top) -->
      <path d="M -0.4,-0.4 C -4,-8 -8,-9.5 -8.8,-5.5 C -8.8,-1.5 -4,0 -0.4,0.4 Z" fill="url(#wingTopLeft)">
        <animate attributeName="opacity" values="0.8; 1; 0.8" dur="3s" repeatCount="indefinite"/>
      </path>

      <!-- Left Hindwing (Bottom) -->
      <path d="M -0.4,0.4 C -4,1.5 -7,4 -6.3,7.5 C -4,9 -1.5,5.5 -0.4,1.5 Z" fill="url(#wingBottomLeft)">
        <animate attributeName="opacity" values="0.9; 0.7; 0.9" dur="3.5s" repeatCount="indefinite"/>
      </path>

      <!-- Overlay Sheen for Iridescent Effect (Left) -->
      <path d="M -0.4,-0.4 C -4,-8 -8,-9.5 -8.8,-5.5 C -8.8,-1.5 -4,0 -0.4,0.4 Z" fill="url(#holoSheen)" mix-blend-mode="screen">
        <animate attributeName="opacity" values="0.2; 0.8; 0.2" dur="2.5s" repeatCount="indefinite"/>
      </path>
      <path d="M -0.4,0.4 C -4,1.5 -7,4 -6.3,7.5 C -4,9 -1.5,5.5 -0.4,1.5 Z" fill="url(#holoSheen)" mix-blend-mode="screen">
        <animate attributeName="opacity" values="0.1; 0.6; 0.1" dur="3.8s" repeatCount="indefinite"/>
      </path>

      <!-- Edge Highlighting (Left) -->
      <path d="M -0.4,-0.4 C -4,-8 -8,-9.5 -8.8,-5.5" fill="none" stroke="#ffffff" stroke-width="0.15" opacity="0.7" filter="url(#glow)"/>
      <path d="M -0.4,0.4 C -4,1.5 -7,4 -6.3,7.5" fill="none" stroke="#00ffff" stroke-width="0.15" opacity="0.6" filter="url(#glow)"/>
    </g>

    <!-- Right Wing Group -->
    <g>
      <!-- Flapping animation for Right Wing -->
      <animateTransform attributeName="transform" type="skewY" values="0; -15; 0; 10; 0" dur="0.6s" repeatCount="indefinite" additive="sum"/>
      <animateTransform attributeName="transform" type="scale" values="1,1; 0.8,1; 1,1; 1.1,1; 1,1" dur="0.6s" repeatCount="indefinite" additive="sum"/>

      <!-- Right Forewing (Top) -->
      <path d="M 0.4,-0.4 C 4,-8 8,-9.5 8.8,-5.5 C 8.8,-1.5 4,0 0.4,0.4 Z" fill="url(#wingTopRight)">
        <animate attributeName="opacity" values="0.8; 1; 0.8" dur="2.8s" repeatCount="indefinite"/>
      </path>

      <!-- Right Hindwing (Bottom) -->
      <path d="M 0.4,0.4 C 4,1.5 7,4 6.3,7.5 C 4,9 1.5,5.5 0.4,1.5 Z" fill="url(#wingBottomRight)">
        <animate attributeName="opacity" values="0.9; 0.7; 0.9" dur="4.2s" repeatCount="indefinite"/>
      </path>

      <!-- Overlay Sheen for Iridescent Effect (Right) -->
      <path d="M 0.4,-0.4 C 4,-8 8,-9.5 8.8,-5.5 C 8.8,-1.5 4,0 0.4,0.4 Z" fill="url(#holoSheen)" mix-blend-mode="screen">
        <animate attributeName="opacity" values="0.2; 0.8; 0.2" dur="3.1s" repeatCount="indefinite"/>
      </path>
      <path d="M 0.4,0.4 C 4,1.5 7,4 6.3,7.5 C 4,9 1.5,5.5 0.4,1.5 Z" fill="url(#holoSheen)" mix-blend-mode="screen">
        <animate attributeName="opacity" values="0.1; 0.6; 0.1" dur="2.2s" repeatCount="indefinite"/>
      </path>

      <!-- Edge Highlighting (Right) -->
      <path d="M 0.4,-0.4 C 4,-8 8,-9.5 8.8,-5.5" fill="none" stroke="#ff8c00" stroke-width="0.15" opacity="0.7" filter="url(#glow)"/>
      <path d="M 0.4,0.4 C 4,1.5 7,4 6.3,7.5" fill="none" stroke="#ffffff" stroke-width="0.15" opacity="0.6" filter="url(#glow)"/>
    </g>

    <!-- Central Body / Core -->
    <g>
      <animateTransform attributeName="transform" type="scale" values="1; 1.05; 1" dur="0.6s" repeatCount="indefinite" additive="sum"/>
      <!-- Body -->
      <ellipse cx="0" cy="0" rx="0.6" ry="2.5" fill="url(#bodyGrad)"/>
      <!-- Antennae -->
      <path d="M -0.2,-2.2 Q -1.2,-3.5 -1.8,-4.5" fill="none" stroke="#ffffff" stroke-width="0.12" opacity="0.8"/>
      <path d="M 0.2,-2.2 Q 1.2,-3.5 1.8,-4.5" fill="none" stroke="#ffffff" stroke-width="0.12" opacity="0.8"/>
    </g>

  </g>
</svg>