<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — SPV Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: #050510;
      color: rgba(240, 240, 240, 0.85);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .wrap { max-width: 360px; }
    .orb {
      width: 80px; height: 80px; border-radius: 9999px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, rgba(0,255,255,0.2) 0%, rgba(255,140,0,0.1) 100%);
      border: 1px solid rgba(0, 255, 255, 0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 32px;
      animation: pulse 2.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 30px rgba(0, 255, 255, 0.2); }
      50% { box-shadow: 0 0 60px rgba(0, 255, 255, 0.45); }
    }
    h1 { font-size: 20px; margin-bottom: 8px; color: #f0f0f0; }
    p { font-size: 14px; color: rgba(240,240,240,0.6); line-height: 1.6; margin-bottom: 20px; }
    button {
      background: linear-gradient(135deg, #00ffff 0%, #00a8a8 100%);
      color: #050510; font-weight: 600;
      padding: 12px 24px; border: none; border-radius: 9999px;
      font-size: 14px; cursor: pointer;
      font-family: inherit;
      box-shadow: 0 8px 32px rgba(0, 255, 255, 0.2);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 12px 48px rgba(0,255,255,0.35); }
    button:active { transform: scale(0.98); }
    .mono { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: rgba(240,240,240,0.35); margin-top: 24px; letter-spacing: 0.15em; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="orb">📡</div>
    <h1>You're offline</h1>
    <p>SPV Chat needs a network connection for messages and the feed. Check your connection and try again.</p>
    <button onclick="location.reload()">Retry</button>
    <div class="mono">SPV Chat · offline mode</div>
  </div>
</body>
</html>
